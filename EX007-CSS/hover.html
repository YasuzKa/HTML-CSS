<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resenha de Hover</title>
    <style>
        div:hover{

            color: yellowgreen;
        }
        div > p {
            display: none;
        }
        div:hover > p{
            display:block;
            color: tomato;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <p>Pega e balança</p>
    <div>passe o mouse aqui
        <p>lalau</p>
    </div>
</body>
</html>
